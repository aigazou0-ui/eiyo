services:
  - type: web
    name: shogi-yaneuraou-api
    env: docker
    plan: free
    envVars:
      - key: YANEURAOU_PATH
        value: /app/engine/yaneuraou
      - key: YANEURAOU_EVAL_DIR
        value: /app/engine/eval
      - key: YANEURAOU_THREADS
        value: 1
      - key: YANEURAOU_HASH
        value: 128
      - key: YANEURAOU_MULTIPV
        value: 3
      - key: NNUE_EVAL_URL
        sync: false
      - key: ALLOW_ORIGIN
        value: "*"
