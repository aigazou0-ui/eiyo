services:
  - type: web
    name: shogi-yaneuraou-api
    env: docker
    plan: free
    envVars:
      - key: YANEURAOU_PATH
        value: /app/engine/yaneuraou
      - key: YANEURAOU_EVAL_DIR
        value: /app/engine/eval
      - key: YANEURAOU_EDITION
        value: YANEURAOU_ENGINE_NNUE
      - key: YANEURAOU_THREADS
        value: 1
      - key: YANEURAOU_HASH
        value: 16
      - key: YANEURAOU_MULTIPV
        value: 1
      - key: NNUE_EVAL_URL
        value: https://raw.githubusercontent.com/Tama4649/Kristallweizen/master/Kristallweizen_kaiV0.4.zip
      - key: ALLOW_ORIGIN
        value: "*"
