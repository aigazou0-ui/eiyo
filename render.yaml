services:
  - type: web
    name: shogi-yaneuraou-api
    env: docker
    plan: free
    envVars:
      - key: YANEURAOU_PATH
        value: /app/engine/yaneuraou
      - key: YANEURAOU_EVAL_DIR
        value: /app/engine/eval
      - key: YANEURAOU_EDITION
        value: YANEURAOU_ENGINE_MATERIAL
      - key: YANEURAOU_TARGET_CPU
        value: OTHER
      - key: YANEURAOU_MATERIAL_LEVEL
        value: 1
      - key: YANEURAOU_THREADS
        value: 1
      - key: YANEURAOU_HASH
        value: 16
      - key: YANEURAOU_MULTIPV
        value: 1
      - key: YANEURAOU_SKIP_READY
        value: 1
      - key: ALLOW_ORIGIN
        value: "*"
