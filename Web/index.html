<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcane Direction Battle - HTML5</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">魔法 × あっちむいてほい × 対戦格闘</p>
        <h1>Arcane Direction Battle</h1>
      </div>
      <button id="startButton" class="primary">ゲーム開始 / リスタート</button>
    </header>

    <section class="hud" aria-label="battle status">
      <article class="panel mage-card">
        <div class="name-row"><strong>PLAYER 炎魔導師</strong><span id="playerWins">0 Wins</span></div>
        <label>HP <meter id="playerHp" min="0" max="100" value="100"></meter></label>
        <label>Mana <meter id="playerMana" min="0" max="100" value="100"></meter></label>
        <label>Ultimate <meter id="playerUlt" min="0" max="100" value="0"></meter></label>
      </article>
      <article class="panel center-card">
        <div id="roundText">Round 1</div>
        <div id="turnText">Turn 1</div>
        <div id="timerText">入力待ち</div>
      </article>
      <article class="panel mage-card enemy">
        <div class="name-row"><strong>CPU 闇魔導師</strong><span id="enemyWins">0 Wins</span></div>
        <label>HP <meter id="enemyHp" min="0" max="100" value="100"></meter></label>
        <label>Mana <meter id="enemyMana" min="0" max="100" value="100"></meter></label>
        <label>Ultimate <meter id="enemyUlt" min="0" max="100" value="0"></meter></label>
      </article>
    </section>

    <section class="stage-wrap">
      <canvas id="gameCanvas" width="1280" height="640" aria-label="battle arena"></canvas>
      <div id="banner" class="banner hidden"></div>
    </section>

    <section class="controls">
      <article class="panel choice-panel">
        <h2>行動</h2>
        <div class="button-grid two">
          <button data-action="attack" class="choice selected">攻撃 Space</button>
          <button data-action="defend" class="choice">防御 Shift</button>
        </div>
      </article>
      <article class="panel choice-panel">
        <h2>方向</h2>
        <div class="button-grid four" id="directionButtons">
          <button data-direction="Up" class="choice selected">↑ W</button>
          <button data-direction="Down" class="choice">↓ S</button>
          <button data-direction="Left" class="choice">← A</button>
          <button data-direction="Right" class="choice">→ D</button>
        </div>
      </article>
      <article class="panel choice-panel">
        <h2>魔法</h2>
        <div class="button-grid five" id="magicButtons">
          <button data-magic="Fire" class="choice selected">火 J</button>
          <button data-magic="Ice" class="choice">氷 K</button>
          <button data-magic="Thunder" class="choice">雷 L</button>
          <button data-magic="Dark" class="choice">闇 ;</button>
          <button data-magic="Light" class="choice">光 '</button>
        </div>
      </article>
      <article class="panel choice-panel">
        <h2>特殊</h2>
        <div class="button-grid two">
          <button id="feintButton" class="choice">フェイント F</button>
          <button id="ultimateButton" class="choice">必殺技 U</button>
        </div>
      </article>
    </section>

    <section class="lower">
      <article class="panel log-panel">
        <h2>バトルログ</h2>
        <ol id="battleLog"></ol>
      </article>
      <article class="panel readout-panel">
        <h2>読み合いUI</h2>
        <p><strong>CPU分析:</strong> <span id="playerReadout">まだ読み合いデータなし</span></p>
        <p><strong>自分分析:</strong> <span id="enemyReadout">まだ読み合いデータなし</span></p>
        <p class="help">方向が一致すると攻撃成功。ズラすと防御成功。固定位置のまま中央結界越しに魔法で読み合え！</p>
      </article>
    </section>
  </main>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
